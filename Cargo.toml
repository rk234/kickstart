[package]
name = "kickstart"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-parse = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.190"
regex = "1.13.1"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.152"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time", "signal"] }
toml = "1.1.4"
