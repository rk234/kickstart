[package]
name = "kickstart"
version = "0.1.0"
edition = "2024"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anstyle-parse = "1.0.0"
clap = { version = "4.6.6", features = ["derive"] }
serde = {version = "1.0.229", features = ["derive"]}
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "net", "sync", "time"] }
toml = "1.1.4"
