# Run from this directory: cargo run -- up (reads ports from .env)
[services]

[services.backend]
command = "python3 -u backend.py"
ready_condition = { port = "{BACKEND_PORT:-8000}" }

[services.seed]
command = "python3 -u seed.py"
depends_on = ["backend"]
ready_condition = { exitcode = 0 }

[services.frontend]
command = "python3 -u frontend.py"
depends_on = ["backend"]
ready_condition = { port = "{FRONTEND_PORT:-3000}" }
